<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Adaptive Quiz</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container wide">
        <h2>Adaptive Quiz</h2>
        <p>Answer all questions carefully. Your performance will determine your learning path.</p>

        <form method="POST" action="{{ url_for('submit_quiz') }}">
            {% for q in questions %}
                <div class="question-box">
                    <p><strong>{{ loop.index }}. {{ q.question_text }}</strong></p>
                    <label><input type="radio" name="q{{ q.question_id }}" value="A" required> A. {{ q.option_a }}</label><br>
                    <label><input type="radio" name="q{{ q.question_id }}" value="B"> B. {{ q.option_b }}</label><br>
                    <label><input type="radio" name="q{{ q.question_id }}" value="C"> C. {{ q.option_c }}</label><br>
                    <label><input type="radio" name="q{{ q.question_id }}" value="D"> D. {{ q.option_d }}</label>
                </div>
            {% endfor %}
            <button type="submit" class="btn">Submit Quiz</button>
        </form>
    </div>
</body>
</html>
